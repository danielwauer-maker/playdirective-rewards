services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      RESEARCH_UPLOAD_DIR: /data/research_uploads
    volumes:
      - research_uploads:/data/research_uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8093:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_ORIGIN: ${NEXT_PUBLIC_ORIGIN}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8092:3000"

volumes:
  postgres_data:
  research_uploads:
